version: 2

dataset_csv: artifacts/canonical_v2/canonical_labeled_flows.csv
model_bundle_dir: artifacts/ml_workflow/v2_full
output_dir: artifacts/multi_tier/v2_latest

target_column: label_id
label_column: label
record_id_column: record_id
src_ip_column: src_ip
dst_ip_column: dst_ip
src_port_column: src_port
dst_port_column: dst_port
capture_id_column: capture_id
window_id_column: window_id
protocol_family_column: protocol_family
requested_server_name_column: requested_server_name

tier1_model_name: gaussian_nb
tier1_threshold: 0.36
deep_model_names:
  - random_forest
  - gradient_boosting
  - xgboost
deep_model_weights:
  random_forest: 1.0
  gradient_boosting: 1.0
  xgboost: 1.0
deep_consensus_threshold: 0.5
min_deep_model_passes: 2
use_optimized_thresholds: false

cluster_min_suspicious_flows: 1

# Evaluate on the same held-out captures as the ML workflow — never seen during training
test_capture_ids:
  - ctu_botnet_369_1
  - ctu_normal_21
