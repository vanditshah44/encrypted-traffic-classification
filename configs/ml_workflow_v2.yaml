version: 2

# EncFlow v2 experiment — all models including XGBoost, capture-aware CV
# Produces results used in ACSAC 2026 Table II

dataset_csv: artifacts/canonical_v2/canonical_labeled_flows.csv
output_dir: artifacts/ml_workflow/v2_full
target_column: label_id
label_column: label
record_id_column: record_id
positive_label: 1
test_size: 0.2
random_state: 42
cv_folds: 3
threshold_metric: youden_j
min_threshold: 0.3
top_k_feature_importance: 20
include_xgboost: true
capture_cv: true

# Hold out one full malicious and one full benign capture for honest test evaluation.
# These captures are NEVER seen during training or CV threshold selection.
test_capture_ids:
  - ctu_botnet_369_1   # 9730 malicious flows, 2019 HTTPS botnet — newest era
  - ctu_normal_21      # 3141 benign flows, Kali Linux HTTPS — distinct from lab benign

# Metadata columns to exclude from training features
extra_excluded_columns:
  - collection_origin
  - environment

permutation_importance:
  n_repeats: 5
  scoring: roc_auc
  max_samples: 4000

models:
  gaussian_nb: {}
  random_forest:
    n_estimators: 300
    random_state: 42
    n_jobs: -1
    class_weight: balanced_subsample
  gradient_boosting:
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 3
    random_state: 42
  xgboost:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 6
    random_state: 42
    n_jobs: -1
    eval_metric: logloss
    verbosity: 0
    scale_pos_weight: 1
