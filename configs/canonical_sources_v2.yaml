    quality_report_json: artifacts/runs/ctu_botnet_369_1/ctu_botnet_369_1_quality_report.json
    provenance_json: artifacts/runs/ctu_botnet_369_1/ctu_botnet_369_1_provenance.json
    extra_labels:
